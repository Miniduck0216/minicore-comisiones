{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta">
  <h2>Ventas registradas</h2>
  <table>
    <thead><tr><th>Fecha</th><th>Vendedor</th><th>Monto</th></tr></thead>
    <tbody>
      {% for v in ventas %}
      <tr><td>{{ v.fecha }}</td><td>{{ v.nombre }}</td><td>${{ "%.2f"|format(v.monto) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
